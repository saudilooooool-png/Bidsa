name: Provision cloud database

# Applies the schema (alembic) and loads the 55K-record historical warehouse
# into the cloud PostgreSQL (e.g. Neon). Runs on GitHub's runners because the
# database is unreachable from some development sandboxes.
#
# Required repository secret:
#   DATABASE_URL_SYNC  e.g. postgresql+psycopg2://USER:PASS@HOST/DB?sslmode=require
#
# Trigger manually from the Actions tab (or via API) whenever the schema or
# the historical shards change. The ETL is idempotent — safe to re-run.

on:
  workflow_dispatch:
  # Auto-provision when the schema, migrations, ETL, or this workflow change.
  push:
    branches: [claude/etimad-plus-viewer-clone-un577o, main]
    paths:
      - "db/schema.sql"
      - "backend/alembic/**"
      - "backend/scripts/etl_historical.py"
      - ".github/workflows/provision-db.yml"

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # This repository is PUBLIC — the connection string must only ever live
      # in the DATABASE_URL_SYNC repository secret, never in this file.
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
    steps:
      - name: Require DATABASE_URL_SYNC secret
        run: |
          if [ -z "$DATABASE_URL_SYNC" ]; then
            echo "::error::DATABASE_URL_SYNC repository secret is not set (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the ETL-change diff below can resolve

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies (slim)
        run: |
          pip install --quiet \
            "sqlalchemy[asyncio]==2.0.36" psycopg2-binary==2.9.10 \
            alembic==1.14.0 pgvector==0.3.6 \
            pydantic==2.10.3 pydantic-settings==2.6.1 python-dotenv==1.0.1 \
            structlog==24.4.0

      - name: Apply migrations (schema.sql + follow-ups)
        working-directory: backend
        run: alembic upgrade head

      # The historical ETL is a one-time bulk load (already resident in the DB).
      # Re-running it on every schema/migration change is redundant and, on a
      # capped tier (e.g. Neon free 512 MB), can fail with DiskFull. Run it only
      # when the data or the ETL script itself changed, or on manual dispatch.
      - name: Decide whether to (re)load the warehouse
        id: etl_gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
          if echo "$CHANGED" | grep -Eq '^(etimad-plus-viewer/data/|backend/scripts/etl_historical\.py)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ETL: no data/ETL-script changes in this push."
          fi

      - name: Load historical warehouse (idempotent)
        if: steps.etl_gate.outputs.run == 'true'
        working-directory: backend
        run: |
          python scripts/etl_historical.py \
            --data-dir ../etimad-plus-viewer/data \
            --db "$DATABASE_URL_SYNC" \
            --report-out ../db/reports/historical_coverage.md

      - name: Verify row counts
        if: steps.etl_gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ["DATABASE_URL_SYNC"])
          with e.connect() as c:
              for t in ("tenders", "awards", "award_winners", "tender_bids", "companies"):
                  n = c.execute(text(f"SELECT count(*) FROM {t}")).scalar()
                  print(f"{t}: {n:,}")
              total = c.execute(text("SELECT sum(win_amount_halalas)/100/1e9 FROM awards")).scalar()
              print(f"total awarded: {float(total):.1f}B SAR")
          PY
