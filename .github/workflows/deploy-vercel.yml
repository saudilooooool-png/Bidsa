name: Deploy frontend to Vercel

# Deploys frontend/ to Vercel from GitHub's runners.
#
# Required repository secret:
#   VERCEL_TOKEN   (create at vercel.com -> Settings -> Tokens)
#
# Optional workflow input:
#   api_url — the public FastAPI base URL. Leave empty to ship DEMO MODE
#   (the site serves the bundled historical snapshot with no backend).

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API_URL for live mode (empty = demo mode)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link project (creates it on first run)
        working-directory: frontend
        run: |
          vercel link --yes --project bidsa --token "$VERCEL_TOKEN" \
            || (vercel projects add bidsa --token "$VERCEL_TOKEN" \
                && vercel link --yes --project bidsa --token "$VERCEL_TOKEN")
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Configure API_URL (live mode only)
        if: ${{ inputs.api_url != '' }}
        working-directory: frontend
        run: |
          vercel env rm API_URL production --yes --token "$VERCEL_TOKEN" || true
          printf '%s' "${{ inputs.api_url }}" | vercel env add API_URL production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (production)
        working-directory: frontend
        run: |
          URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "### ✅ Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
