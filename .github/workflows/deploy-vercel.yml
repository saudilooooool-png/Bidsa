name: Deploy frontend to Vercel

# Deploys frontend/ to Vercel from GitHub's runners.
#
# Required repository secret:
#   VERCEL_TOKEN   (create at vercel.com -> Settings -> Tokens)
#
# Selecting demo vs live mode — the backend URL is read from, in order:
#   1. the api_url workflow_dispatch input (one-off override),
#   2. the API_URL repository *variable*
#      (Settings -> Secrets and variables -> Actions -> Variables tab),
#   3. the committed default below (the deployed Render backend).
# The variable exists so the backend can be repointed on a plain push, without
# needing permission to dispatch workflows. If every source is empty the site
# ships DEMO MODE: the bundled historical snapshot, no backend required.
#
# Setting API_URL is non-destructive by design: when it resolves empty this
# workflow leaves whatever env the Vercel project already has, so a value set
# by hand in the Vercel dashboard is never silently wiped by a frontend push.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API_URL for live mode (empty = demo mode)"
        required: false
        default: ""
  # Auto-deploy on frontend changes (push events deploy demo/live per the
  # API_URL env already stored in the Vercel project).
  push:
    branches: [claude/etimad-plus-viewer-clone-un577o, main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-vercel.yml"

# Newer deploys supersede in-flight ones instead of racing them.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Read via env, never interpolated into a shell command, so an
      # attacker-controlled value cannot inject shell syntax.
      # Falls back to the deployed Render backend. This is a public URL, not a
      # credential, so committing it is safe; set the API_URL repository
      # variable to point the site at a different backend.
      RESOLVED_API_URL: ${{ inputs.api_url || vars.API_URL || 'https://bidsa-api.onrender.com' }}
    steps:
      - name: Require VERCEL_TOKEN secret
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository secret is not set (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Verify backend is reachable (live mode only)
        if: env.RESOLVED_API_URL != ''
        run: |
          echo "Probing $RESOLVED_API_URL/health ..."
          # A free-tier backend may be asleep; allow generous time to wake.
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 90 "$RESOLVED_API_URL/health" || true)
            case "$body" in
              *'"ok"'*)
                echo "backend healthy: $body"
                exit 0
                ;;
            esac
            echo "attempt $attempt did not return a healthy response (got: ${body:-<empty>})"
            sleep 10
          done
          echo "::error::$RESOLVED_API_URL/health never returned {\"status\":\"ok\"}. Refusing to switch the site to live mode against an unreachable backend."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link project (creates it on first run)
        working-directory: frontend
        run: |
          vercel link --yes --project bidsa --token "$VERCEL_TOKEN" \
            || (vercel projects add bidsa --token "$VERCEL_TOKEN" \
                && vercel link --yes --project bidsa --token "$VERCEL_TOKEN")

      - name: Configure API_URL (live mode only)
        if: env.RESOLVED_API_URL != ''
        working-directory: frontend
        run: |
          vercel env rm API_URL production --yes --token "$VERCEL_TOKEN" || true
          printf '%s' "$RESOLVED_API_URL" | vercel env add API_URL production --token "$VERCEL_TOKEN"
          echo "mode: LIVE -> $RESOLVED_API_URL"

      - name: Report demo mode
        if: env.RESOLVED_API_URL == ''
        run: |
          echo "mode: DEMO (no api_url input and no API_URL repository variable)."
          echo "Any API_URL already stored in the Vercel project is left untouched."

      - name: Deploy (production)
        working-directory: frontend
        run: |
          URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "### ✅ Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
        id: deploy
